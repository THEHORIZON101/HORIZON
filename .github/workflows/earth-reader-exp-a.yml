name: Earth Reader Experiment A

on:
  push:
    branches: [earth-reader-exp-a]
  workflow_dispatch:

jobs:
  residual-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy scikit-learn

      - name: Download public PostRainBench Germany validation and test arrays
        run: |
          set -euxo pipefail
          base='https://zenodo.org/records/7244319/files'
          for f in 01_vld_c.npy 01_vld_y.npy 01_tst_c.npy 01_tst_y.npy; do
            curl -L --fail --retry 8 --retry-delay 5 --connect-timeout 30 "$base/$f?download=1" -o "$f"
          done

      - name: Run aligned full-coverage residual correction test
        run: |
          cat > /tmp/exp.py <<'PY'
          import json
          import numpy as np
          from scipy.ndimage import uniform_filter, maximum_filter
          from sklearn.ensemble import HistGradientBoostingRegressor
          from sklearn.metrics import balanced_accuracy_score, confusion_matrix

          RAIN_THRESHOLD = 0.1
          RNG = np.random.default_rng(20260816)

          v_c = np.squeeze(np.load('01_vld_c.npy')).astype(np.float32)
          v_y_hi = np.squeeze(np.load('01_vld_y.npy')).astype(np.float32)
          t_c = np.squeeze(np.load('01_tst_c.npy')).astype(np.float32)
          t_y_hi = np.squeeze(np.load('01_tst_y.npy')).astype(np.float32)
          print('ORIGINAL_SHAPES', v_c.shape, v_y_hi.shape, t_c.shape, t_y_hi.shape, flush=True)

          def downsample_radar_to_nwp(y, c):
              if y.shape == c.shape:
                  return y
              if y.ndim != 3 or c.ndim != 3 or y.shape[0] != c.shape[0]:
                  raise RuntimeError(f'Unexpected dimensions: radar={y.shape}, nwp={c.shape}')
              if y.shape[1] != 2*c.shape[1] or y.shape[2] != 2*c.shape[2]:
                  raise RuntimeError(f'Expected exact 2x radar grid: radar={y.shape}, nwp={c.shape}')
              # For an exact factor-of-two resize, bilinear interpolation with
              # align_corners=False (the authors' preprocessing) is the mean
              # of each aligned 2x2 source block.
              n,h,w = c.shape
              return y.reshape(n,h,2,w,2).mean(axis=(2,4)).astype(np.float32)

          v_y = downsample_radar_to_nwp(v_y_hi, v_c)
          t_y = downsample_radar_to_nwp(t_y_hi, t_c)
          del v_y_hi, t_y_hi
          print('ALIGNED_SHAPES', v_c.shape, v_y.shape, t_c.shape, t_y.shape, flush=True)

          def feature_arrays(c):
              clean=np.nan_to_num(c,nan=0.0,posinf=0.0,neginf=0.0)
              mean3=uniform_filter(clean,size=(1,3,3),mode='nearest')
              max3=maximum_filter(clean,size=(1,3,3),mode='nearest')
              mean9=uniform_filter(clean,size=(1,9,9),mode='nearest')
              h,w=clean.shape[-2:]
              yy,xx=np.mgrid[0:h,0:w]
              xx=np.broadcast_to((xx/max(w-1,1)).astype(np.float32),(clean.shape[0],h,w))
              yy=np.broadcast_to((yy/max(h-1,1)).astype(np.float32),(clean.shape[0],h,w))
              return [clean,mean3,max3,mean9,xx,yy]

          v_feats=feature_arrays(v_c)
          t_feats=feature_arrays(t_c)

          def valid_indices(c,y,start_sample,end_sample):
              per=c.shape[1]*c.shape[2]
              lo=start_sample*per; hi=end_sample*per
              idx=np.arange(lo,hi,dtype=np.int64)
              m=np.isfinite(c.ravel()[idx]) & np.isfinite(y.ravel()[idx])
              return idx[m]

          split_sample=int(v_c.shape[0]*0.70)
          fit_pool=valid_indices(v_c,v_y,0,split_sample)
          cal_idx=valid_indices(v_c,v_y,split_sample,v_c.shape[0])
          test_idx=valid_indices(t_c,t_y,0,t_c.shape[0])

          def balanced_training_sample(indices,y,max_n=400000):
              vals=y.ravel()[indices]
              pos=indices[vals>=RAIN_THRESHOLD]
              neg=indices[vals<RAIN_THRESHOLD]
              n=min(len(pos),len(neg),max_n//2)
              out=np.concatenate([RNG.choice(pos,n,replace=False),RNG.choice(neg,n,replace=False)])
              RNG.shuffle(out)
              return out

          fit_idx=balanced_training_sample(fit_pool,v_y)
          print('PIXELS', {'fit':len(fit_idx),'calibration':len(cal_idx),'blind_test':len(test_idx)}, flush=True)

          def X_at(feats,idx):
              return np.column_stack([f.ravel()[idx] for f in feats]).astype(np.float32)

          Xfit=X_at(v_feats,fit_idx)
          raw_fit=v_c.ravel()[fit_idx].astype(np.float32)
          yfit=v_y.ravel()[fit_idx].astype(np.float32)
          residual=yfit-raw_fit

          model=HistGradientBoostingRegressor(
              loss='absolute_error',learning_rate=0.07,max_iter=260,
              max_leaf_nodes=31,l2_regularization=1.0,random_state=20260816)
          model.fit(Xfit,residual)

          def corrected(feats,c,idx):
              raw=c.ravel()[idx].astype(np.float32)
              return np.maximum(0.0,raw+model.predict(X_at(feats,idx)).astype(np.float32))

          cal_y=v_y.ravel()[cal_idx]>=RAIN_THRESHOLD
          cal_raw=v_c.ravel()[cal_idx].astype(np.float32)
          cal_corr=corrected(v_feats,v_c,cal_idx)

          def tune_threshold(values,labels):
              finite=values[np.isfinite(values)]
              # Quantiles keep the search tied only to development data.
              cand=np.unique(np.concatenate(([0.0,RAIN_THRESHOLD],np.quantile(finite,np.linspace(.002,.998,180)))))
              best=(-1.0,None)
              for th in cand:
                  ba=balanced_accuracy_score(labels,values>=th)
                  if ba>best[0]: best=(float(ba),float(th))
              return best

          raw_cal_ba,raw_th=tune_threshold(cal_raw,cal_y)
          corr_cal_ba,corr_th=tune_threshold(cal_corr,cal_y)

          # Full untouched test set: no selective prediction and no subsampling.
          test_y=t_y.ravel()[test_idx]>=RAIN_THRESHOLD
          test_raw=t_c.ravel()[test_idx].astype(np.float32)
          test_corr=corrected(t_feats,t_c,test_idx)
          raw_pred=test_raw>=raw_th
          corr_pred=test_corr>=corr_th

          def score(pred):
              tn,fp,fn,tp=confusion_matrix(test_y,pred,labels=[False,True]).ravel()
              sens=tp/(tp+fn); spec=tn/(tn+fp)
              return {'balanced_accuracy':float((sens+spec)/2),'sensitivity':float(sens),'specificity':float(spec),
                      'tn':int(tn),'fp':int(fp),'fn':int(fn),'tp':int(tp)}

          raw=score(raw_pred); corr=score(corr_pred)
          result={
              'benchmark':'PostRainBench Germany COSMO-DE-EPS vs RADKLIM, precipitation-only mechanism test',
              'rain_definition_mm_per_h':RAIN_THRESHOLD,
              'alignment':'RADKLIM 72x72 -> NWP 36x36 by factor-2 bilinear/2x2 mean',
              'chronology':'first 70% validation samples fit; last 30% calibration; official test untouched',
              'coverage':'all finite test pixels',
              'development_fit_pixels':int(len(fit_idx)),
              'development_calibration_pixels':int(len(cal_idx)),
              'blind_test_pixels':int(len(test_idx)),
              'raw_threshold':raw_th,'corrected_threshold':corr_th,
              'raw_validation_balanced_accuracy':raw_cal_ba,
              'corrected_validation_balanced_accuracy':corr_cal_ba,
              'raw_test':raw,'corrected_test':corr,
              'delta_percentage_points':float((corr['balanced_accuracy']-raw['balanced_accuracy'])*100)
          }
          print('EARTH_READER_RESULT='+json.dumps(result,sort_keys=True),flush=True)
          PY
          python /tmp/exp.py
