name: Earth Reader Experiment A

on:
  push:
    branches: [earth-reader-exp-a]
  workflow_dispatch:

jobs:
  residual-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy scikit-learn lightgbm

      - name: Download PostRainBench Germany NWP and radar data
        run: |
          set -euxo pipefail
          base='https://zenodo.org/records/7244319/files'
          for f in 01_vld_c.npy 01_vld_y.npy 01_vld_x.npy 01_vld_t.npy 01_tst_c.npy 01_tst_y.npy 01_tst_x.npy 01_tst_t.npy; do
            curl -L --fail --retry 8 --retry-delay 5 --connect-timeout 30 "$base/$f?download=1" -o "$f"
            ls -lh "$f"
          done

      - name: Compare precipitation-only and full-state residual correctors
        run: |
          cat > /tmp/full_state.py <<'PY'
          import json, numpy as np
          from scipy.ndimage import uniform_filter, maximum_filter
          import lightgbm as lgb
          from sklearn.metrics import balanced_accuracy_score

          RAIN=0.1
          RNG=np.random.default_rng(20260816)
          CHUNK=180_000

          vc=np.squeeze(np.load('01_vld_c.npy',mmap_mode='r')).astype(np.float32,copy=False)
          vyh=np.squeeze(np.load('01_vld_y.npy',mmap_mode='r')).astype(np.float32,copy=False)
          vx=np.load('01_vld_x.npy',mmap_mode='r')
          tc=np.squeeze(np.load('01_tst_c.npy',mmap_mode='r')).astype(np.float32,copy=False)
          tyh=np.squeeze(np.load('01_tst_y.npy',mmap_mode='r')).astype(np.float32,copy=False)
          tx=np.load('01_tst_x.npy',mmap_mode='r')
          vt=np.load('01_vld_t.npy',allow_pickle=True)
          tt=np.load('01_tst_t.npy',allow_pickle=True)
          print('SHAPES',vc.shape,vyh.shape,vx.shape,tc.shape,tyh.shape,tx.shape,vt.shape,tt.shape,flush=True)

          def down2(y,c):
              n,h,w=c.shape
              if y.shape==(n,h,w): return np.asarray(y,dtype=np.float32)
              if y.shape!=(n,2*h,2*w): raise RuntimeError((y.shape,c.shape))
              # Matches factor-2 bilinear align_corners=False used in benchmark preprocessing.
              return np.asarray(y).reshape(n,h,2,w,2).mean(axis=(2,4)).astype(np.float32)
          vy=down2(vyh,vc); ty=down2(tyh,tc)
          del vyh,tyh

          def precip_maps(c):
              z=np.nan_to_num(np.asarray(c),nan=0.0,posinf=0.0,neginf=0.0)
              m3=uniform_filter(z,size=(1,3,3),mode='nearest')
              mx3=maximum_filter(z,size=(1,3,3),mode='nearest')
              m9=uniform_filter(z,size=(1,9,9),mode='nearest')
              h,w=z.shape[-2:]; yy,xx=np.mgrid[0:h,0:w]
              xx=(xx/max(w-1,1)).astype(np.float32); yy=(yy/max(h-1,1)).astype(np.float32)
              return z,m3,mx3,m9,xx,yy
          vpm=precip_maps(vc); tpm=precip_maps(tc)
          H,W=vc.shape[1:]; PER=H*W

          def idx_for_samples(samples,c,y):
              samples=np.asarray(samples,dtype=np.int64)
              base=(samples[:,None]*PER + np.arange(PER,dtype=np.int64)[None,:]).ravel()
              mask=np.isfinite(c.ravel()[base]) & np.isfinite(y.ravel()[base])
              return base[mask]

          def ordered_samples(times):
              a=np.asarray(times).reshape(-1)
              try: return np.argsort(a,kind='stable')
              except Exception: return np.arange(len(a))
          order=ordered_samples(vt)
          cut=int(len(order)*.70)
          fit_samples=order[:cut]; cal_samples=order[cut:]
          fit_pool=idx_for_samples(fit_samples,vc,vy)
          cal_idx=idx_for_samples(cal_samples,vc,vy)
          test_idx=idx_for_samples(np.arange(tc.shape[0]),tc,ty)

          def balanced_fit(indices,y,max_n=220_000):
              vals=y.ravel()[indices]
              p=indices[vals>=RAIN]; n=indices[vals<RAIN]
              k=min(len(p),len(n),max_n//2)
              out=np.concatenate([RNG.choice(p,k,replace=False),RNG.choice(n,k,replace=False)])
              RNG.shuffle(out); return out
          fit_idx=balanced_fit(fit_pool,vy)
          print('COUNTS',{'fit':len(fit_idx),'cal':len(cal_idx),'test':len(test_idx)},flush=True)

          def positions(idx):
              s=idx//PER; rem=idx%PER; r=rem//W; c=rem%W
              return s,r,c

          def precip_X(pm,idx):
              s,r,c=positions(idx)
              z,m3,mx3,m9,xx,yy=pm
              return np.column_stack((z[s,r,c],m3[s,r,c],mx3[s,r,c],m9[s,r,c],xx[r,c],yy[r,c])).astype(np.float32)

          def full_X(x,pm,idx):
              s,r,c=positions(idx)
              state=np.asarray(x[s,r,c,:],dtype=np.float32)
              state=np.nan_to_num(state,nan=0.0,posinf=0.0,neginf=0.0)
              return np.concatenate((precip_X(pm,idx),state),axis=1)

          residual=vy.ravel()[fit_idx].astype(np.float32)-vc.ravel()[fit_idx].astype(np.float32)
          common=dict(objective='regression_l1',n_estimators=350,learning_rate=.045,num_leaves=31,
                      min_child_samples=80,subsample=.85,colsample_bytree=.72,reg_lambda=1.0,
                      random_state=20260816,n_jobs=-1,verbosity=-1)
          pmodel=lgb.LGBMRegressor(**common)
          xmodel=lgb.LGBMRegressor(**common)
          pmodel.fit(precip_X(vpm,fit_idx),residual)
          xmodel.fit(full_X(vx,vpm,fit_idx),residual)
          print('MODELS_FIT',flush=True)

          def predict_corr(model,x,pm,c,indices,full):
              out=np.empty(len(indices),dtype=np.float32)
              rawflat=c.ravel()
              for a in range(0,len(indices),CHUNK):
                  ids=indices[a:a+CHUNK]
                  X=full_X(x,pm,ids) if full else precip_X(pm,ids)
                  out[a:a+len(ids)]=np.maximum(0.0,rawflat[ids]+model.predict(X).astype(np.float32))
              return out

          cal_y=vy.ravel()[cal_idx]>=RAIN
          cal_raw=vc.ravel()[cal_idx].astype(np.float32)
          cal_p=predict_corr(pmodel,vx,vpm,vc,cal_idx,False)
          cal_x=predict_corr(xmodel,vx,vpm,vc,cal_idx,True)

          def tune(vals,labels):
              cand=np.unique(np.concatenate(([0.0,RAIN],np.quantile(vals[np.isfinite(vals)],np.linspace(.002,.998,180)))))
              best=(-1.0,None)
              for th in cand:
                  ba=balanced_accuracy_score(labels,vals>=th)
                  if ba>best[0]: best=(float(ba),float(th))
              return best
          rva,rth=tune(cal_raw,cal_y); pva,pth=tune(cal_p,cal_y); xva,xth=tune(cal_x,cal_y)
          print('VAL',{'raw':rva,'precip_resid':pva,'full_state_resid':xva},flush=True)

          def test_stream():
              counts={k:np.zeros(4,dtype=np.int64) for k in ('raw','precip','full')}
              yflat=ty.ravel(); cflat=tc.ravel()
              for a in range(0,len(test_idx),CHUNK):
                  ids=test_idx[a:a+CHUNK]
                  y=yflat[ids]>=RAIN; raw=cflat[ids].astype(np.float32)
                  pc=np.maximum(0.0,raw+pmodel.predict(precip_X(tpm,ids)).astype(np.float32))
                  xc=np.maximum(0.0,raw+xmodel.predict(full_X(tx,tpm,ids)).astype(np.float32))
                  for name,pred in [('raw',raw>=rth),('precip',pc>=pth),('full',xc>=xth)]:
                      tn=np.sum(~y & ~pred); fp=np.sum(~y & pred); fn=np.sum(y & ~pred); tp=np.sum(y & pred)
                      counts[name]+=np.array([tn,fp,fn,tp],dtype=np.int64)
              return counts
          counts=test_stream()

          def score(q):
              tn,fp,fn,tp=map(int,q); sens=tp/(tp+fn); spec=tn/(tn+fp)
              return {'balanced_accuracy':(sens+spec)/2,'sensitivity':sens,'specificity':spec,
                      'tn':tn,'fp':fp,'fn':fn,'tp':tp}
          raw=score(counts['raw']); pre=score(counts['precip']); full=score(counts['full'])
          result={
            'benchmark':'PostRainBench Germany COSMO-DE-EPS 143-channel state mechanism test',
            'rain_threshold_mm_per_h':RAIN,'coverage':'all finite official test pixels',
            'alignment':'72x72 radar downsampled to aligned 36x36 NWP grid by factor-2 bilinear/2x2 mean',
            'development':'validation samples sorted by provided time; first 70% fit, last 30% threshold calibration',
            'fit_pixels':len(fit_idx),'calibration_pixels':len(cal_idx),'blind_test_pixels':len(test_idx),
            'nwp_channels':int(vx.shape[-1]),
            'thresholds':{'raw':rth,'precip_residual':pth,'full_state_residual':xth},
            'validation_ba':{'raw':rva,'precip_residual':pva,'full_state_residual':xva},
            'raw':raw,'precip_residual':pre,'full_state_residual':full,
            'gain_precip_vs_raw_pp':(pre['balanced_accuracy']-raw['balanced_accuracy'])*100,
            'gain_full_vs_raw_pp':(full['balanced_accuracy']-raw['balanced_accuracy'])*100,
            'gain_full_vs_precip_pp':(full['balanced_accuracy']-pre['balanced_accuracy'])*100
          }
          print('EARTH_READER_RESULT='+json.dumps(result,sort_keys=True),flush=True)
          PY
          python /tmp/full_state.py
